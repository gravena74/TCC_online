<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Agendar — Cafofo do Pet</title>
  </head>
  <body>
    <div class="screen" id="screen" style="display: none;">
      <div class="top-bar">
        <a href="agendar.html" aria-label="Voltar" class="btn-round">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </a>
        <h1 style="font-size: 1.25rem; font-weight: 700;">Agendar</h1>
      </div>

      <form id="checkoutForm">
        <p class="section-label">Como será o check-in?</p>
        <div>
          <label class="option-card">
            <input type="radio" name="checkin" value="leva_ao_pet_shop" />
            <span class="option-card__label">
              <span class="option-card__dot"></span>
              <span>
                <span class="option-card__title" style="display:block;">Vou levar o pet ao pet shop</span>
                <span class="option-card__subtitle" style="display:block;">Você mesmo traz o pet até a loja no horário marcado</span>
              </span>
            </span>
          </label>
          <label class="option-card">
            <input type="radio" name="checkin" value="busca_em_casa" />
            <span class="option-card__label">
              <span class="option-card__dot"></span>
              <span>
                <span class="option-card__title" style="display:block;">Preciso que busquem o pet na minha casa</span>
                <span class="option-card__subtitle" style="display:block;">Buscamos seu pet no endereço combinado (taxa adicional)</span>
              </span>
            </span>
          </label>
        </div>

        <p class="section-label" style="margin-top: 1.25rem;">Como será o check-out?</p>
        <div>
          <label class="option-card">
            <input type="radio" name="checkout" value="retira_no_pet_shop" />
            <span class="option-card__label">
              <span class="option-card__dot"></span>
              <span>
                <span class="option-card__title" style="display:block;">Vou retirar o pet no pet shop</span>
                <span class="option-card__subtitle" style="display:block;">Você mesmo busca o pet na loja ao final do serviço</span>
              </span>
            </span>
          </label>
          <label class="option-card">
            <input type="radio" name="checkout" value="entrega_em_casa" />
            <span class="option-card__label">
              <span class="option-card__dot"></span>
              <span>
                <span class="option-card__title" style="display:block;">Preciso que entreguem o pet na minha casa</span>
                <span class="option-card__subtitle" style="display:block;">Levamos seu pet até o endereço combinado (taxa adicional)</span>
              </span>
            </span>
          </label>
        </div>

        <div class="address-section">
          <p class="section-label">Endereço para busca/entrega</p>
          <div class="card field-stack">
            <div class="field-row">
              <input class="input-field" id="cep" placeholder="CEP" />
              <input class="input-field" id="state" placeholder="UF" maxlength="2" style="text-transform: uppercase;" />
            </div>
            <input class="input-field" id="street" placeholder="Rua" />
            <div class="field-row">
              <input class="input-field" id="number" placeholder="Número" />
              <input class="input-field" id="neighborhood" placeholder="Bairro" />
            </div>
            <input class="input-field" id="city" placeholder="Cidade" />
          </div>
        </div>

        <p class="form-error" id="errorMsg" style="display: none; margin-top: 1rem;"></p>

        <p class="text-center" id="serviceLine" style="margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted);"></p>

        <div class="field-stack" style="margin-top: 1rem;">
          <button type="submit" class="btn-primary">Avançar</button>
          <a href="agendar.html" class="btn-outline">Voltar</a>
        </div>
      </form>
    </div>

    <div class="loading-screen" id="authLoading">
      <span>Carregando...</span>
    </div>

    <script type="module" src="js/checkout.js"></script>
  </body>
</html>
