<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Cadastrar pet — Cafofo do Pet</title>
  </head>
  <body>
    <div class="screen" id="screen" style="display: none;">
      <div class="top-bar">
        <a href="pets.html" aria-label="Voltar" class="btn-round">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </a>
        <h1 style="font-size: 1.25rem; font-weight: 700;">Cadastrar</h1>
      </div>

      <h2 class="form-title">Cafofo do Pet</h2>

      <form id="petForm" class="field-stack" style="margin-top: 1.5rem; padding-bottom: 6rem;">
        <button type="button" class="photo-upload" id="photoUploadBtn">
          <span class="material-symbols-rounded" id="photoPlaceholderIcon" aria-hidden="true">image</span>
          <span class="photo-upload__badge"><span class="material-symbols-rounded" aria-hidden="true">photo_camera</span></span>
          <input type="file" id="photoInput" accept="image/*" style="display: none;" />
        </button>

        <input class="input-field" id="name" placeholder="Nome..." />

        <input class="input-field" id="age" placeholder="Idade..." inputmode="numeric" />

        <select class="input-field" id="breed">
          <option value="" disabled selected>Selecione a Raça...</option>
          <option>Golden Retriever</option>
          <option>Shih Tzu</option>
          <option>Vira-lata</option>
          <option>Pomerânia</option>
          <option>Lulu da Pomerânia</option>
          <option>Keeshond</option>
          <option>Samoyed</option>
          <option>Akita Inu</option>
          <option>Chow Chow</option>
          <option>Yorkshire Terrier</option>
          <option>Poodle</option>
          <option>Buldogue Francês</option>
          <option>Pinscher</option>
          <option>Pug</option>
          <option>Maltês</option>
        </select>

        <select class="input-field" id="size">
          <option value="" disabled selected>Selecione o Porte...</option>
          <option>Pequeno</option>
          <option>Médio</option>
          <option>Grande</option>
        </select>

        <p class="form-error" id="formError" style="display: none;"></p>

        <div class="footer-bar footer-bar--divider">
          <button type="submit" class="btn-primary" id="submitBtn">Cadastrar</button>
        </div>
      </form>
    </div>

    <div class="loading-screen" id="authLoading">
      <span>Carregando...</span>
    </div>

    <script type="module" src="js/pets-novo.js"></script>
  </body>
</html>
