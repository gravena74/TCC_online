<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Agendamento confirmado — Cafofo do Pet</title>
  </head>
  <body>
    <div class="screen" id="screen" style="display: none; align-items: center; justify-content: center; text-align: center;">
      <div class="paw-logo paw-logo--lg" style="justify-content: center;">
        <div class="paw-logo__icon">
          <span class="material-symbols-rounded" aria-hidden="true">pets</span>
        </div>
        <span class="paw-logo__text">Cafofo do Pet</span>
      </div>

      <div class="success-icon"><span class="material-symbols-rounded" aria-hidden="true">celebration</span></div>

      <h1 style="margin-top: 1.25rem; font-size: 1.5rem;">Agendamento confirmado!</h1>
      <p style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--muted);" id="message"></p>

      <div class="success-actions">
        <a class="btn-primary" href="pets.html">Agendar mais um pet</a>
        <a class="btn-outline" href="agendamentos.html">Acompanhar agendamento</a>
      </div>
    </div>

    <div class="loading-screen" id="authLoading">
      <span>Carregando...</span>
    </div>

    <script type="module" src="js/sucesso.js"></script>
  </body>
</html>
