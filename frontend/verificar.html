<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Verificar código — Cafofo do Pet</title>
  </head>
  <body>
    <div class="photo-shell">
      <img
        class="photo-shell__img"
        src="https://images.unsplash.com/photo-1517849845537-4d257902861a?q=80&w=800&auto=format&fit=crop"
        alt="Cachorro pug fofo olhando para a câmera"
      />

      <div class="photo-shell__body">
        <div class="photo-shell__badge">
          <span class="material-symbols-rounded" aria-hidden="true">pets</span>
        </div>

        <div class="photo-shell__heading">
          <h1><span>Cafofo</span> <span class="accent">do Pet</span></h1>
          <p class="photo-shell__tagline">Cuidado e carinho para seu pet.</p>
        </div>

        <div class="photo-shell__content">
          <p class="text-center" style="font-size: 0.875rem; font-weight: 600;">
            Digite o código que chegou na sua caixa de mensagem
          </p>

          <form id="otpForm" style="display: flex; flex: 1; flex-direction: column;">
            <input
              class="otp-input"
              id="code"
              name="code"
              inputmode="numeric"
              pattern="\d{4}"
              maxlength="4"
              autocomplete="one-time-code"
              placeholder="0000"
            />

            <p class="form-error text-center" id="formError" style="display: none; margin-top: 0.75rem;"></p>
            <p class="hint" id="devCodeHint" style="display: none;"></p>

            <div class="spacer"></div>

            <div class="field-stack">
              <button type="submit" class="btn-primary" id="submitBtn">Avançar</button>
              <a class="btn-outline" href="login.html">Voltar</a>
            </div>

            <p class="hint">Verifique sua caixa de mensagem.</p>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="js/verificar.js"></script>
  </body>
</html>
