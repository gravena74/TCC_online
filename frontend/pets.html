<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Escolha o pet — Cafofo do Pet</title>
  </head>
  <body>
    <div class="screen screen--with-bottom-nav" id="screen" style="display: none;">
      <div class="top-bar-row">
        <div class="top-bar" style="padding-top: 1.5rem; margin-bottom: 0;">
          <a href="home.html" aria-label="Voltar ao início" class="btn-round">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
          </a>
          <h1 style="font-size: 1.25rem; font-weight: 700;" id="screenTitle">Escolha o pet</h1>
        </div>
        <a href="pets-novo.html" aria-label="Cadastrar novo pet" class="btn-round btn-round--brand" style="margin-top: 1.5rem;" id="newPetLink">
          <span class="material-symbols-rounded" aria-hidden="true">add</span>
        </a>
      </div>

      <p class="text-center" id="loadingMsg" style="margin-top: 2.5rem; font-size: 0.875rem; color: var(--muted);">
        Carregando seus pets...
      </p>
      <p class="form-error text-center" id="errorMsg" style="display: none; margin-top: 2.5rem;"></p>

      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state__icon"><span class="material-symbols-rounded" aria-hidden="true">pets</span></div>
        <p class="empty-state__title">Nenhum pet cadastrado.</p>
        <p class="empty-state__subtitle">Clique em "+" para cadastrar seu pet.</p>
      </div>

      <div class="pet-list" id="petList"></div>

      <div class="footer-bar" id="advanceBar">
        <button type="button" class="btn-primary" id="advanceBtn" disabled>Avançar</button>
      </div>

      <nav class="bottom-nav" id="bottomNav" style="display: none;">
        <a href="home.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">home</span>
          <span>Início</span>
        </a>
        <a href="pets.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">calendar_add_on</span>
          <span>Agendar</span>
        </a>
        <a href="pets.html?mode=manage" class="bottom-nav__item bottom-nav__item--active">
          <span class="material-symbols-rounded" aria-hidden="true">pets</span>
          <span>Pets</span>
        </a>
        <a href="agendamentos.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">schedule</span>
          <span>Histórico</span>
        </a>
        <a href="perfil.html" class="bottom-nav__item">
          <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <div class="loading-screen" id="authLoading">
      <span>Carregando...</span>
    </div>

    <dialog id="confirmDialog">
      <h3 class="dialog-title">Cancelar agendamento?</h3>
      <p class="dialog-message" id="dialogMessage"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-danger" id="confirmCancelBtn">Sim, cancelar</button>
        <button type="button" class="btn-outline" id="cancelCancelBtn">Não, manter</button>
      </div>
    </dialog>

    <script type="module" src="js/pets.js"></script>
  </body>
</html>
