<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D6339" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <title>Agendamentos do Dia — Painel Admin</title>
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-stats-grid" id="statsGrid"></section>

        <section class="admin-panel">
          <div class="admin-panel__head">
            <h2>Agendamentos de hoje</h2>
            <span id="todayDateLabel" style="font-size: 0.8125rem; color: var(--muted);"></span>
          </div>
          <div id="todayLoading" class="admin-empty">Carregando...</div>
          <div class="admin-table-wrap" id="todayTableWrap" style="display: none;">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Horário</th>
                  <th>Cliente</th>
                  <th>Pet</th>
                  <th>Serviço</th>
                  <th>Valor</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="todayTableBody"></tbody>
            </table>
          </div>
          <div class="admin-empty" id="todayEmpty" style="display: none;">Nenhum agendamento para hoje.</div>
        </section>

        <section class="admin-panel">
          <div class="admin-panel__head">
            <h2>Clientes em análise</h2>
            <a href="solicitacoes.html" class="btn-link" style="font-size: 0.8125rem;">Ver todas</a>
          </div>
          <div id="pendingLoading" class="admin-empty">Carregando...</div>
          <div class="admin-table-wrap" id="pendingTableWrap" style="display: none;">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Telefone</th>
                  <th>Cadastrado em</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="pendingTableBody"></tbody>
            </table>
          </div>
          <div class="admin-empty" id="pendingEmpty" style="display: none;">Nenhum cliente aguardando análise.</div>
        </section>
      </main>
    </div>

    <script type="module" src="js/admin-dashboard.js"></script>
  </body>
</html>
