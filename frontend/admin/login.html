<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D6339" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <title>Acesso Admin — Cafofo do Pet</title>
  </head>
  <body class="admin-login-body">
    <div class="admin-login-card">
      <div class="admin-login-card__badge">
        <span class="material-symbols-rounded" aria-hidden="true">shield_person</span>
      </div>
      <h1>Painel Admin</h1>
      <p class="admin-login-card__subtitle">Cafofo do Pet — acesso restrito à equipe</p>

      <form id="adminLoginForm">
        <div class="field-stack">
          <input
            class="input-field"
            id="username"
            name="username"
            placeholder="Usuário"
            autocomplete="username"
            autofocus
          />
          <input
            class="input-field"
            id="password"
            name="password"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
          />
          <p class="form-error" id="formError" style="display: none;"></p>
        </div>

        <div class="field-stack" style="margin-top: 1.5rem;">
          <button type="submit" class="btn-primary" id="submitBtn">Entrar</button>
        </div>
      </form>

      <p class="admin-login-hint">Acesso exclusivo para administradores do Cafofo do Pet.</p>
    </div>

    <script type="module" src="js/admin-login.js"></script>
  </body>
</html>
