<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D6339" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <title>Calendário — Painel Admin</title>
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <div class="admin-calendar-layout">
          <section class="admin-panel">
            <div class="admin-panel__head">
              <div class="admin-calendar-nav">
                <button type="button" id="prevMonthBtn" aria-label="Mês anterior">
                  <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
                </button>
                <strong id="monthLabel"></strong>
                <button type="button" id="nextMonthBtn" aria-label="Próximo mês">
                  <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
                </button>
              </div>
            </div>
            <div class="admin-calendar-grid" id="calendarGrid"></div>
          </section>

          <section class="admin-panel">
            <div class="admin-panel__head">
              <h2 id="selectedDayLabel">Selecione um dia</h2>
            </div>
            <div class="admin-day-list" id="dayList"></div>
            <div class="admin-empty" id="dayEmpty" style="display: none;">Nenhum agendamento neste dia.</div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="js/admin-calendario.js"></script>
  </body>
</html>
